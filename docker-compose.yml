services:
  db:
    image: postgres:17-alpine
    container_name: scheduling-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scheduling}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./SchedulingBackend
      dockerfile: Dockerfile
    container_name: scheduling-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-scheduling};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Gss Encryption Mode=Disable"
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
